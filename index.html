<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wenzhe's Tools</title>
  <meta name="description" content="Singapore housing and CPF planning tools.">
  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #5f6368;
      --border: #e2e0da;
      --accent: #c8102e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141416;
        --card: #1e1e21;
        --text: #f2f2f2;
        --muted: #a0a0a8;
        --border: #2e2e33;
        --accent: #ff5a6e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 760px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 40px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
    .card {
      display: block;
      padding: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon { font-size: 1.75rem; }
    .card h2 { font-size: 1.15rem; margin: 12px 0 4px; }
    .card p { color: var(--muted); margin: 0 0 16px; }
    .go { color: var(--accent); font-weight: 600; }
    footer { color: var(--muted); font-size: .85rem; margin-top: 48px; }
  </style>
</head>
<body>
  <main>
    <h1>Wenzhe's Tools</h1>
    <p class="lead">Planning tools for Singapore housing and CPF.</p>
    <div class="grid">
      <a class="card" href="https://wenzhecheah.github.io/btoPlanner/">
        <div class="icon" aria-hidden="true">🏠</div>
        <h2>BTO Planner</h2>
        <p>Plan your BTO application, timeline and costs.</p>
        <span class="go">Open →</span>
      </a>
      <a class="card" href="https://wenzhecheah.github.io/CPF-Forecast-Calculator/">
        <div class="icon" aria-hidden="true">📈</div>
        <h2>CPF Forecast Calculator</h2>
        <p>Project how your CPF balances grow over time.</p>
        <span class="go">Open →</span>
      </a>
    </div>
    <footer>Not financial advice. Check figures with CPF Board and HDB.</footer>
  </main>
</body>
</html>
